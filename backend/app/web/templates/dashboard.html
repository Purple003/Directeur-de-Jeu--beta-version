{% extends "base.html" %}
{% block content %}
  <div class="grid">
    <section class="card">
      <h2>Create Course and Generate Quiz</h2>
      <form class="form" action="/dashboard/create-course" method="post" enctype="multipart/form-data">
        <label>
          <span>Subject</span>
          <input name="subject" placeholder="Math" required />
        </label>
        <label>
          <span>Level</span>
          <select name="level" required>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </label>
        <label>
          <span>Description</span>
          <textarea name="description" placeholder="Short course description"></textarea>
        </label>
        <label>
          <span>PDF/DOCX</span>
          <input type="file" name="file" accept=".pdf,.docx" />
        </label>
        <button type="submit" class="btn">Generate</button>
      </form>
      <p class="hint">Uses Groq/OpenAI-compatible LLM config from <code>backend/.env</code>.</p>
    </section>

    <section class="card">
      <h2>Courses</h2>
      <div class="table">
        <div class="row head">
          <div>ID</div><div>Subject</div><div>Level</div><div>Created</div><div></div>
        </div>
        {% for c in courses %}
          <div class="row">
            <div>{{ c.id }}</div>
            <div>{{ c.subject }}</div>
            <div><span class="pill">{{ c.level }}</span></div>
            <div>{{ c.created_at }}</div>
            <div><a class="link" href="/dashboard/course/{{ c.id }}">Open</a></div>
          </div>
        {% endfor %}
      </div>
    </section>
  </div>
{% endblock %}
