{% extends "base.html" %}
{% block content %}
  <section class="card" style="max-width:520px;margin:0 auto;">
    <h2>Professor Login</h2>
    <form class="form" action="/dashboard/login" method="post">
      <label>
        <span>Username</span>
        <input name="username" required />
      </label>
      <label>
        <span>Password</span>
        <input name="password" type="password" required />
      </label>
      <button type="submit" class="btn">Login</button>
    </form>
    {% if error %}
      <p style="color:#b91c1c;margin-top:10px;">{{ error }}</p>
    {% endif %}
    <p class="hint">Use <code>POST /auth/register</code> to create a professor user first.</p>
  </section>
{% endblock %}
