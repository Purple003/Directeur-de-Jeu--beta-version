{% set mode = "auth" %}
{% extends "base.html" %}

{% block auth_content %}
<div style="width: 100%; max-width: 420px;">

    <!-- Brand mark -->
    <div style="text-align: center; margin-bottom: 32px;">
        <div style="
            width: 52px; height: 52px; border-radius: 14px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(99,102,241,0.4);
        ">
            <i data-lucide="flame" style="width: 28px; height: 28px; color: white;"></i>
        </div>
        <div style="font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.02em;">
            Edu<span style="color: var(--accent-base);">Forge</span>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-secondary);">Adaptive Serious Game Platform</p>
        <div style="width: 40px; height: 2px; background: var(--accent-base); margin: 14px auto 0; border-radius: 99px; opacity: 0.5;"></div>
    </div>

    <!-- Card -->
    <div class="card" style="padding: 32px;">

        {% if error %}
        <div style="
            display: flex; align-items: center; gap: 10px;
            background: var(--status-error-bg); border: 1px solid #fca5a5;
            color: #991b1b; border-radius: var(--radius-sm);
            padding: 12px 14px; font-size: 0.875rem; margin-bottom: 20px;
        ">
            <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
            {{ error }}
        </div>
        {% endif %}

        <form action="/dashboard/login" method="post">
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">
                    Username
                </label>
                <input
                    id="username" name="username" type="text" required
                    placeholder="your_username"
                    style="
                        width: 100%; padding: 10px 14px;
                        border: 1px solid var(--border); border-radius: var(--radius-sm);
                        font-size: 0.9rem; outline: none;
                        transition: border-color 0.15s ease;
                        background: var(--bg-app);
                    "
                    onfocus="this.style.borderColor='var(--accent-base)'"
                    onblur="this.style.borderColor='var(--border)'"
                >
            </div>
            <div style="margin-bottom: 24px;">
                <label style="display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">
                    Password
                </label>
                <input
                    id="password" name="password" type="password" required
                    placeholder="••••••••"
                    style="
                        width: 100%; padding: 10px 14px;
                        border: 1px solid var(--border); border-radius: var(--radius-sm);
                        font-size: 0.9rem; outline: none;
                        transition: border-color 0.15s ease;
                        background: var(--bg-app);
                    "
                    onfocus="this.style.borderColor='var(--accent-base)'"
                    onblur="this.style.borderColor='var(--border)'"
                >
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px; font-size: 0.95rem;">
                Sign In
            </button>
        </form>
    </div>

    <p style="text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 20px;">
        Need an account? Use <code style="background: var(--border); padding: 2px 6px; border-radius: 4px;">POST /auth/register</code>
    </p>
</div>
{% endblock %}
